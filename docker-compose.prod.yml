version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: { context: ., dockerfile: apps/backend/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment: { DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public }
    ports: ["4000:4000"]
    volumes: [uploads:/app/uploads]
    depends_on: { postgres: { condition: service_healthy } }
  frontend:
    build: { context: ., dockerfile: apps/frontend/Dockerfile }
    restart: unless-stopped
    environment: { NEXT_PUBLIC_API_URL: http://localhost:4000/api }
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres-data:
  uploads:
